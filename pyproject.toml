[project]
name = "terragraph"
version = "0.1.0"
description = "Analizador de infraestructura Terraform basado en grafos"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]