# Configuración de Alembic. Se usa desde la raíz del repo:
#   alembic upgrade head
# La URL de la base no va aquí: migrations/env.py la toma de DATABASE_URL
# (o del Postgres local), igual que la app.

[alembic]
script_location = %(here)s/migrations
# Agrega la raíz del repo al sys.path para que env.py pueda importar `app`.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
