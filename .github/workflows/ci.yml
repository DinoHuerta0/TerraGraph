name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # Postgres real para las pruebas de integración; mismo usuario y base que
    # docker/docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: terragraph
          POSTGRES_PASSWORD: terragraph
          POSTGRES_DB: terragraph
        ports:
          - 5432:5432
        # Los pasos empiezan hasta que Postgres acepta conexiones.
        options: >-
          --health-cmd "pg_isready -U terragraph -d terragraph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Mismo formato que da Neon (postgresql://), así CI prueba también ese caso.
      DATABASE_URL: postgresql://terragraph:terragraph@localhost:5432/terragraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest -v --cov=app
