name: CI

on:
  pull_request:
    branches: [main]
  # cd.yml llama a este mismo workflow para correr lint y pruebas antes de
  # publicar la imagen, sin copiar los jobs.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # Postgres real para las pruebas de integración; mismo usuario y base que
    # docker/docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: terragraph
          POSTGRES_PASSWORD: terragraph
          POSTGRES_DB: terragraph
        ports:
          - 5432:5432
        # Los pasos empiezan hasta que Postgres acepta conexiones.
        options: >-
          --health-cmd "pg_isready -U terragraph -d terragraph"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Mismo formato que da Neon (postgresql://), así CI prueba también ese caso.
      DATABASE_URL: postgresql://terragraph:terragraph@localhost:5432/terragraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      # Falla si alguna prueba falla o si la cobertura de app/ baja de 80 %.
      # term-missing muestra en el log las líneas que no cubre ninguna prueba.
      - run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # Pruebas del JavaScript de la página (HistoryStore) con el runner que trae
  # Node, sin package.json ni dependencias.
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test "tests/js/*.test.js"

  # Comprueba que la imagen se construye, pero no la publica. Cuando cd.yml
  # llama a este workflow el evento es push, así que este job se salta y la
  # imagen se construye una sola vez, en cd.yml.
  build:
    if: github.event_name == 'pull_request'
    needs: [lint, test, test-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # Caché de capas en GitHub Actions: si requirements.txt no cambia,
          # no se vuelven a instalar las dependencias.
          cache-from: type=gha
          cache-to: type=gha,mode=max
